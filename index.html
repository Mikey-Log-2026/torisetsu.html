    <script>
        let synth = window.speechSynthesis;
        let isSpeaking = false;
        
        // BGM用のオーディオオブジェクトを作成
        // ※「bgm.mp3」の部分を、実際の音楽ファイルのパスに書き換えてください
        const bgm = new Audio('bgm.mp3');
        bgm.loop = true;     // ループ再生を有効に
        bgm.volume = 0.15;   // 音量調整（0.0 〜 1.0）。読み上げを邪魔しないよう小さめ（15%）に設定

        // 読み上げたいテキストをページ内から自動抽出して整える関数
        function getSpeechText() {
            const target = document.getElementById('speech-target');
            let text = target.innerText;
            
            text = text.replace(/①/g, '、まるいち、')
                       .replace(/②/g, '、まるに、')
                       .replace(/③/g, '、まるさん、')
                       .replace(/④/g, '、まるよん、')
                       .replace(/PC/gi, 'ピーシー')
                       .replace(/QR/gi, 'キューアール')
                       .replace(/LED/gi, 'エルイーディー');
            return text;
        }

        // 読み上げ開始
        function startSpeech() {
            if (synth.speaking) {
                synth.cancel(); // 既に喋っていたら一旦止める
            }
            
            // BGMも一旦停止して最初から再生
            bgm.pause();
            bgm.currentTime = 0;

            const text = getSpeechText();
            const utterance = new SpeechSynthesisUtterance(text);
            
            utterance.lang = 'ja-JP';   // 日本語に設定
            utterance.rate = 1.0;       // 読み上げ速度
            utterance.pitch = 1.0;      // 声の高さ

            // 読み上げが終了した時のイベント
            utterance.onend = function() {
                stopSpeech(); // 読み上げが終わったらBGMも止める
            };

            // 読み上げ中にエラーが起きた場合も停止処理
            utterance.onerror = function() {
                stopSpeech();
            };

            // BGMの再生を開始し、同時に読み上げをスタート
            bgm.play().catch(e => console.log("BGM再生エラー:", e));
            synth.speak(utterance);
            isSpeaking = true;
        }

        // 読み上げとBGMの停止
        function stopSpeech() {
            synth.cancel();
            bgm.pause();
            bgm.currentTime = 0; // 曲を先頭に戻す
            isSpeaking = false;
        }

        // 【超重要】スマホのセキュリティ対策
        document.body.addEventListener('click', (e) => {
            if (e.target.tagName !== 'BUTTON' && !isSpeaking) {
                startSpeech();
            }
        });
    </script>
